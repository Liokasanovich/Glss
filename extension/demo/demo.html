<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>GLSS 视频超分辨率与帧插值 - 本地快速演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 960px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
    }
    .video-card {
      background: #131b2e;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 480px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .instructions {
      background: rgba(30, 41, 59, 0.6);
      border-left: 4px solid #6366f1;
      padding: 16px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .instructions strong {
      color: #60a5fa;
    }
    .badge-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .pill {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #818cf8;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ GLSS 浏览器视频增强演示 (Pure GPU)</h1>
      <p class="subtitle">实时视频超分辨率 (FSR+RCAS/Anime4K) 与运动补偿帧插值 (Nx) 测试沙盒</p>
      <div class="badge-bar">
        <span class="pill">纯显卡 WebGL2 / WebGPU</span>
        <span class="pill">零 CPU 拷贝</span>
        <span class="pill">Document PiP 小窗</span>
        <span class="pill">支持 Bilibili / YouTube / 本地视频</span>
      </div>
    </header>

    <div class="instructions">
      👉 <strong>使用指南：</strong>
      把鼠标悬停在下方视频画面上，右上角会浮现 <strong>⚡ GLSS 🚀 一键超分插帧</strong> 按钮。
      点击后即可一键唤出独立小窗播放器，实时体验 <strong>24fps -> 60fps/120fps 流畅插帧</strong> 与 <strong>FSR 锐化超分放大</strong>！
    </div>

    <div class="video-card">
      <div class="video-wrapper">
        <video id="demo-video" controls autoplay loop muted playsinline></video>
      </div>
    </div>
  </div>

  <script src="demo.js"></script>
</body>
</html>
